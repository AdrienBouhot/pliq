[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    dbt: lance vraiment dbt (parse, seed, build) — quelques secondes par test

# Une dépréciation n'est pas du bruit ici : tout ce que fait l'atelier repose
# sur les API de dbt-core et de FastAPI, et c'est par là que les ruptures
# arrivent — avec un an de préavis, à condition de le lire. `ignore` les
# taisait toutes, et taisait donc aussi les nôtres : le serveur appelait
# encore `@app.on_event("startup")`, que FastAPI annonce retiré, sans qu'aucun
# test ne le dise.
#
# On les fait donc échouer, et on n'excepte que ce qui vient d'ailleurs — une
# ligne par cas, avec la raison. Une exception qui devient inutile se voit :
# pytest refuse un `ignore` qui ne filtre plus rien ? Non — mais la ligne
# porte de quoi la relire, et c'est déjà ce qu'il faut pour la retirer.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    # Starlette pousse `httpx2` pour son client de test. C'est l'affaire de
    # FastAPI, pas la nôtre : nous ne dépendons de httpx que pour les tests.
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
    # Starlette importe un alias anyio que celui-ci vient de déprécier. Rien
    # de l'atelier n'est en cause : c'est starlette qui devra suivre.
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning
    # dbt-core et ses dépendances (agate, protobuf, dateutil…) ont leurs
    # propres dépréciations, qu'aucune modification de l'atelier ne corrige.
    ignore::DeprecationWarning:dbt.*
    ignore::DeprecationWarning:dbt_common.*
    ignore::DeprecationWarning:agate.*
    ignore::DeprecationWarning:google.*
